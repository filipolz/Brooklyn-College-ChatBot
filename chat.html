<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <title>Chat | Brooklyn College Student Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="page page--gradient">
    <header class="header header--chat">
      <div class="header__inner header__inner--chat">
        <div class="header__chat-row">
          <img src="images/brooklyn-CUNY-logo.png" alt="Brooklyn College, CUNY" class="header__logo">
          <div class="header__chat-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
            </svg>
          </div>
          <div>
            <h1 class="header__chat-title">Student Support Chat</h1>
          </div>
        </div>
      </div>
    </header>

    <main class="chat-main">
      <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
          <div class="message-row message-row--bot">
            <div class="message-bubble message-bubble--bot">
              <p>Hi! I'm the Brooklyn College Student Support assistant. I can help you find the right faculty, answer questions, or guide you around campus. How can I help you today?</p>
            </div>
          </div>
        </div>

        <div class="quick-actions" id="quickActions">
          <p class="quick-actions__label">Quick actions</p>
          <div class="quick-actions__list">
            <button type="button" class="quick-action-btn" data-action="Find a faculty or department">
              <span>👤</span><span>Find a faculty or department</span>
            </button>
            <button type="button" class="quick-action-btn" data-action="Campus map & directions">
              <span>📍</span><span>Campus map &amp; directions</span>
            </button>
            <button type="button" class="quick-action-btn" data-action="Registration & enrollment">
              <span>📋</span><span>Registration &amp; enrollment</span>
            </button>
            <button type="button" class="quick-action-btn" data-action="Financial aid & bursar">
              <span>💳</span><span>Financial aid &amp; bursar</span>
            </button>
            <button type="button" class="quick-action-btn" data-action="Library & research">
              <span>📚</span><span>Library &amp; research</span>
            </button>
            <button type="button" class="quick-action-btn" data-action="General question">
              <span>💬</span><span>General question</span>
            </button>
          </div>
        </div>

        <div class="chat-input-bar">
          <div class="chat-input-bar__inner">
            <textarea
              id="chatInput"
              rows="1"
              placeholder="Ask about faculty, campus, or anything else..."
              aria-label="Message"
            ></textarea>
            <button type="button" class="chat-send-btn" id="sendBtn" disabled aria-label="Send message">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <p class="footer" style="margin-top:1rem;">
        Brooklyn College · The City University of New York
      </p>
    </main>
  </div>

  <script src="js/chat.js"></script>
</body>
</html>
